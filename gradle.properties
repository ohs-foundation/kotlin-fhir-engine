# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx8g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dkotlin.daemon.jvm.options=-XX:MaxMetaspaceSize=1g

android.useAndroidX=true

org.gradle.daemon=true
org.gradle.caching=true

kotlin.daemon.jvmargs=-Xmx16g
kotlin.native.ignoreDisabledTargets=true

# Maven publishing coordinates for the :engine library.
# Bump mavenVersion before cutting a release.
mavenGroupId=dev.ohs.fhir
mavenArtifactId=fhir-engine
mavenVersion=2.0.0-alpha02

# Benchmarks. Synthea is pinned by version and checksum so a dataset can be reproduced; changing
# either changes the report fingerprint and makes old reports incomparable.
synthea.version=v4.0.0
synthea.sha256=ed43c20ad40ba5c3bc724503a5af032715fe3c491620b766148e7c2361e6ecc1
# Synthea patients, not synthetic-profile patients: it generates full medical histories, so 10
# patients is roughly 6k resources where the synthetic dataset's 100 "patients" is roughly 600.
benchmark.population=10
benchmark.seed=20260819
