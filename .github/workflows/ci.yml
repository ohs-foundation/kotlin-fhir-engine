name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # Runs on any branch from the Actions tab, for branches that have no pull request to main yet.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8"

jobs:
  lint-and-compile:
    name: Lint and compile
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Full history, because Spotless only checks files changed since origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check code formatting (Spotless)
        run: ./gradlew spotlessCheck

      # The android-fhir commit docs/test-parity.csv was checked against. Its engine tests have not
      # changed since.
      - name: Check out the android-fhir engine tests
        uses: actions/checkout@v4
        with:
          repository: ohs-foundation/android-fhir
          ref: 28a5034563b83586d67c16bf18627fd540c32c27
          path: android-fhir
          sparse-checkout: |
            engine/src/test
            engine/src/androidTest

      - name: Check every android-fhir engine test is mapped
        run: python3 scripts/test_parity.py android-fhir && git diff --exit-code docs/test-parity.csv

      - name: Check the list of ignored tests is up to date
        run: python3 scripts/ignored_tests.py && git diff --exit-code docs/ignored-tests.md

      # Every module, not just the engine the test jobs build. iOS compiles in the ios job.
      - name: Compile Android, desktop and web
        run: >
          ./gradlew compileDebugKotlinAndroid :engine:compileAndroidMain compileKotlinDesktop
          compileKotlinJs compileKotlinWasmJs

  # Each job runs the shared tests (commonTest) and its platform's own tests. Android runs them on
  # an emulator in android-test, because the engine needs a real SQLite.
  test:
    name: Test ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: desktop
            tasks: ":engine:desktopTest"
            os: ubuntu-latest
          - name: JS
            tasks: ":engine:jsBrowserTest"
            os: ubuntu-latest
          - name: Wasm
            tasks: ":engine:wasmJsBrowserTest"
            os: ubuntu-latest
          # One macOS job builds Kotlin/Native once for both SQLite variants and every module.
          - name: iOS
            tasks: >-
              compileKotlinIosArm64 compileKotlinIosSimulatorArm64
              :engine:iosSimulatorArm64Test :engine:iosSimulatorArm64SystemSqliteTest
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Add swap space
        if: runner.os == 'Linux'
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # The toolchain is about 2 GB, so only main saves it and other branches read it.
      - name: Restore Kotlin/Native
        if: runner.os == 'macOS'
        id: konan
        uses: actions/cache/restore@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # --continue so the second iOS suite still runs when the first fails.
      - name: Run tests
        run: ./gradlew ${{ matrix.tasks }} --continue "-Pkotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Save Kotlin/Native
        if: runner.os == 'macOS' && github.ref == 'refs/heads/main' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.name }}
          path: |
            engine/build/reports/tests/
            engine/build/test-results/

  android-test:
    name: Test Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Add swap space
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The system image and the emulator snapshot are about 2 GB, so only main saves them.
      - name: Restore the emulator
        id: emulator
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/system-images
            ~/.android/avd/gradle-managed
          key: emulator-${{ hashFiles('engine/build.gradle.kts') }}
          restore-keys: emulator-

      # The emulator is declared in engine/build.gradle.kts, so this is the same run as locally.
      - name: Run tests
        run: >
          ./gradlew :engine:pixel2Api34AndroidDeviceTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          "-Pkotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Save the emulator
        if: github.ref == 'refs/heads/main' && steps.emulator.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/system-images
            ~/.android/avd/gradle-managed
          key: emulator-${{ hashFiles('engine/build.gradle.kts') }}

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-android
          path: |
            engine/build/reports/
            engine/build/outputs/androidTest-results/

  summary:
    name: Test results
    needs: [test, android-test]
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: test-reports-*
          path: test-reports

      - name: Write the results table
        run: python3 .github/scripts/test_summary.py test-reports >> "$GITHUB_STEP_SUMMARY"

  # Each shard runs base and head for its share of the classes on one runner. The comment workflow
  # merges the shards.
  benchmark:
    name: Benchmarks, part ${{ matrix.shard }} of 2
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
      - uses: actions/checkout@v4

      # Read from the API so a re-run sees labels added after the event. Empty when the pull
      # request changes nothing the benchmarks compile.
      - name: Choose the tier
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          mkdir -p reports
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "tasks=:engine:benchmark" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only > reports/changed-files.txt \
            || rm -f reports/changed-files.txt
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' \
              | grep -qx 'benchmark:full'; then
            tasks=":engine:benchmark"
          elif [ -f reports/changed-files.txt ] && [ "$(python3 .github/scripts/benchmark_table.py \
              --changed-files reports/changed-files.txt --count-changes)" = 0 ]; then
            tasks=""
          else
            tasks=":engine:prBenchmark :engine:prNoisyBenchmark"
          fi
          echo "tasks=$tasks" >> "$GITHUB_OUTPUT"

      - name: Add swap space
        if: steps.tier.outputs.tasks != ''
        run: |
          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile
          sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=8192
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

      - name: Set up JDK 21
        if: steps.tier.outputs.tasks != ''
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.tier.outputs.tasks != ''
        uses: gradle/actions/setup-gradle@v4

      # On a pull request, base and head run in this one job, because scores from different
      # runners are not comparable. Databases go on tmpfs because runner disk speed is unstable.
      - name: Create a RAM-backed temp directory
        if: github.event_name == 'pull_request' && steps.tier.outputs.tasks != ''
        run: mkdir -p /dev/shm/benchmarks

      - name: Check out the base branch
        if: github.event_name == 'pull_request' && steps.tier.outputs.tasks != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      # The base may predate the benchmarks; the comment then shows the head alone.
      - name: Run the benchmarks against the base
        if: github.event_name == 'pull_request' && steps.tier.outputs.tasks != ''
        continue-on-error: true
        working-directory: base
        run: ./gradlew ${{ steps.tier.outputs.tasks }} -Pbenchmark.shard=${{ matrix.shard }} -Pbenchmark.tmpdir=/dev/shm/benchmarks "-Pkotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Run the benchmarks against the head
        if: github.event_name == 'pull_request' && steps.tier.outputs.tasks != ''
        run: ./gradlew ${{ steps.tier.outputs.tasks }} -Pbenchmark.shard=${{ matrix.shard }} -Pbenchmark.tmpdir=/dev/shm/benchmarks "-Pkotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Run the full tier
        if: github.event_name != 'pull_request'
        run: ./gradlew :engine:benchmark -Pbenchmark.shard=${{ matrix.shard }} "-Pkotlin.daemon.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      # Fork pull requests leave workflow_run.pull_requests empty; the artifact carries the number.
      # A skipped run uploads these alone, and the comment says so.
      - name: Collect reports
        if: always()
        run: |
          mkdir -p reports/head reports/base
          cp -r engine/build/reports/benchmarks/. reports/head/ 2>/dev/null || true
          cp -r base/engine/build/reports/benchmarks/. reports/base/ 2>/dev/null || true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "${{ github.event.number }}" > reports/pr-number.txt
            echo "${{ github.event.pull_request.base.sha }}" > reports/base-sha.txt
          fi

      - name: Record the machine
        if: always() && steps.tier.outputs.tasks != ''
        run: |
          {
            echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-}"
            echo "OS: $(. /etc/os-release && echo "$PRETTY_NAME") $(uname -r)"
            lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|L3 cache):'
            free -h | awk '/^Mem:/ {print "Memory: " $2}'
            java -version 2>&1 | head -n 1
          } > reports/machine.txt
          cat reports/machine.txt

      # This shard's rows only; the pull request comment has all of them.
      - name: Write the job summary
        if: always()
        run: |
          ARGS=(--repository "$GITHUB_REPOSITORY")
          if [ -f reports/machine.txt ]; then ARGS+=(--machine reports/machine.txt); fi
          if [ -n "$(find reports/base -name '*.json' -print -quit)" ]; then
            ARGS+=(--base reports/base)
          fi
          if [ -f reports/base-sha.txt ]; then
            ARGS+=(--base-sha "$(head -n 1 reports/base-sha.txt)" --head-sha "${{ github.event.pull_request.head.sha }}")
          fi
          if [ -f reports/changed-files.txt ]; then
            ARGS+=(--changed-files reports/changed-files.txt)
          fi
          python3 .github/scripts/benchmark_table.py reports/head "${ARGS[@]}" >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload benchmark reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-shard-${{ matrix.shard }}
          path: reports/
